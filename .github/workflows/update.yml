name: Refresh and deploy Cyclone Watch Pro
on:
  workflow_dispatch:
    inputs:
      draft_run:
        description: Reviewed V31 draft run ID (blank = weather refresh only)
        type: string
        required: false
      package_sha256:
        description: Exact reviewed package SHA-256 (from draft run summary)
        type: string
        required: false
      approve_publication:
        description: I reviewed this exact report and approve website publication
        type: boolean
        default: false
        required: true
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths-ignore: [data.json, archive.json, satellite-archive.json, source-health.json]
concurrency:
  group: cyclone-pages
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python update.py
      - name: Archive verified bulletin summaries
        run: python archive.py
        continue-on-error: true
      - name: Retrieve optional official satellite imagery metadata
        run: python media.py
        continue-on-error: true
      - name: Archive satellite links and source health
        run: python satellite_archive.py
        continue-on-error: true
      - name: Save observation history
        run: |
          git config user.name 'cyclone-feed[bot]'
          git config user.email 'cyclone-feed@users.noreply.github.com'
          git add data.json
          if test -f archive.json; then git add archive.json; fi
          for f in satellite-archive.json source-health.json; do if test -f "$f"; then git add "$f"; fi; done
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh official cyclone observations'
            git push origin HEAD:main
          fi
      - name: Validate studio JavaScript
        run: |
          node --check tracker.js && node test-tracker.cjs
          node test-v31.cjs
          node --check premium-player.js && node test-premium-player.cjs
          node --check v9.js && node --check video-player.js && node --check v15.js && node --check v6.js
          python -m py_compile media.py
          node test-v16-playback.cjs
          node --check v17.js && node --check v8.js
          python test-v17-archive.py
          node --check v18.js && node test-v18-map.cjs
          node --check v19.js && node test-v19.cjs
          node --check v20.js && node test-v20.cjs
          node --check v21.js && node test-v21.cjs
          node --check v22.js && node test-v22.cjs
          node --check v23.js && node test-v23.cjs
          node --check v24.js && node test-v24.cjs
          python -m py_compile video.py tv_layout.py
          python -m py_compile regional_sources.py
      - name: Check regional official bulletin page reachability
        run: python regional_sources.py
        continue-on-error: true
      - name: Validate and retrieve official cyclone forecast
        run: |
          python test-official-forecast.py
          node --check official-forecast.js && node test-official-forecast.cjs
          python official_forecast.py
      - name: Retrieve review queue metadata only
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python broadcast_archive.py
      - name: Approve exact reviewed report (manual main dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.approve_publication == true
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_RUN: ${{ inputs.draft_run }}
          APPROVED_PACKAGE_SHA: ${{ inputs.package_sha256 }}
        run: |
          set -euo pipefail
          [[ "$DRAFT_RUN" =~ ^[0-9]+$ && "$APPROVED_PACKAGE_SHA" =~ ^[a-f0-9]{64}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DRAFT_RUN" > _draft_run.json
          python -c 'import json; r=json.load(open("_draft_run.json")); assert r["head_branch"]=="main" and r["status"]=="completed" and r["conclusion"]=="success" and r["path"].split("@")[0]==".github/workflows/video.yml"'
          gh run download "$DRAFT_RUN" --name Inside-Mauritius-V31-Reviewed-Draft --dir _video
          node v31-review.cjs approve _video "$DRAFT_RUN" publication-receipt.json
          node v31-review.cjs release _video "$DRAFT_RUN" publication-receipt.json _approved
          git config user.name 'cyclone-feed[bot]'
          git config user.email 'cyclone-feed@users.noreply.github.com'
          git add publication-receipt.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record manual V31 publication approval'
            git push origin HEAD:main
          fi
      - name: Retrieve previously approved report only
        if: github.event_name != 'workflow_dispatch' || inputs.approve_publication != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if test -f publication-receipt.json; then
            run_id="$(python -c 'import json; print(json.load(open("publication-receipt.json"))["run_id"])')"
            if [[ "$run_id" =~ ^[0-9]+$ ]] && gh run download "$run_id" --name Inside-Mauritius-V31-Reviewed-Draft --dir _video; then
              if ! node v31-review.cjs release _video "$run_id" publication-receipt.json _approved; then
                rm -rf _approved
                echo 'Approved report no longer eligible; weather dashboard only.'
              fi
            fi
          fi
      - name: Stage public files
        run: |
          mkdir -p _site
          cp index.html data.json v6.js v6.css v7.js v7.css v8.js v8.css v9.js v9.css video-player.js premium-player.js v15.js v15.css v17.js v18.js v19.js v20.js v21.js v22.js v23.js v24.js official-forecast.js official-forecast.json voice-remux.py studio-logo.png manifest.webmanifest icon.svg sw.js _site/
          if test -f archive.json; then cp archive.json _site/; fi
          if test -f broadcast-archive.json; then cp broadcast-archive.json _site/; fi
          if test -f media.json; then cp media.json _site/; fi
          if test -f regional-sources.json; then cp regional-sources.json _site/; fi
          for f in satellite-archive.json source-health.json; do if test -f "$f"; then cp "$f" _site/; fi; done
          if test -f _approved/publication.json; then
            mkdir -p _site/video
            cp -r _approved/. _site/video/
          fi
      - name: Stage independent satellite tracker
        run: |
          cp tracker.html tracker.css tracker.js _site/
          mkdir -p _site/tracker-media
          if python -m pip install --quiet Pillow; then
            timeout 150s python tracker_media.py _site/tracker-media || true
          fi
          if ! test -s _site/tracker-media/manifest.json; then
            printf '{"status":"unavailable","frames":[]}' > _site/tracker-media/manifest.json
          fi
      - name: Bundle consistent dashboard shell
        run: python build_dashboard.py _site
      - name: Test mobile and desktop dashboard startup on repair commits
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo timeout 90s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 install -y -qq ffmpeg || {
              sudo timeout 90s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 update -qq
              sudo timeout 120s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 install -y -qq ffmpeg
            }
          fi
          ffmpeg -version
          if test -f _site/video/satellite-fullscreen-4k.mp4; then
            ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 _site/video/satellite-fullscreen-4k.mp4 | grep -x '3840,2160'
          fi
          npm install --no-save --no-package-lock playwright
          node test-mobile-startup.cjs
          node test-tracker-browser.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy refreshed dashboard
        id: deployment
        uses: actions/deploy-pages@v4

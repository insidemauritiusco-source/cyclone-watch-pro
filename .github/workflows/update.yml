name: Refresh and deploy Cyclone Watch Pro
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Render 4K satellite weather video']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths-ignore: [data.json, archive.json]
concurrency:
  group: cyclone-pages
  cancel-in-progress: false
jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python update.py
      - name: Archive verified bulletin summaries
        run: python archive.py
        continue-on-error: true
      - name: Save observation history
        run: |
          git config user.name 'cyclone-feed[bot]'
          git config user.email 'cyclone-feed@users.noreply.github.com'
          git add data.json
          if test -f archive.json; then git add archive.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh official cyclone observations'
            git push origin HEAD:main
          fi
      - name: Retrieve optional official satellite imagery metadata
        run: python media.py
        continue-on-error: true
      - name: Validate studio JavaScript
        run: node --check v9.js && node --check video-player.js
      - name: Retrieve latest successful video artifact
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python broadcast_archive.py
          if test -f broadcast-runs.txt; then
            while read -r run_id; do
              test -n "$run_id" || continue
              rm -rf _video
              if gh run download "$run_id" --name Inside-Mauritius-4K-Weather-Video --dir _video && test -f _video/source.json && test -f _video/weather-fr.mp4 && test -f _video/weather-mfe.mp4; then break; fi
            done < broadcast-runs.txt
          fi
      - name: Stage public files
        run: |
          mkdir -p _site
          cp index.html data.json v6.js v6.css v7.js v7.css v8.js v8.css v9.js v9.css video-player.js voice-remux.py studio-logo.png manifest.webmanifest icon.svg sw.js _site/
          if test -f archive.json; then cp archive.json _site/; fi
          if test -f broadcast-archive.json; then cp broadcast-archive.json _site/; fi
          if test -f media.json; then cp media.json _site/; fi
          if test -f _video/source.json && test -f _video/weather-fr.mp4 && test -f _video/weather-mfe.mp4; then
            mkdir -p _site/video
            cp _video/source.json _video/weather-fr.mp4 _video/weather-mfe.mp4 _site/video/
            for f in narration-fr.txt narration-mfe.txt weather-fr-male.mp4 weather-mfe-male.mp4 voice-fr.mp3 voice-fr-male.mp3 voice-mfe.mp3 voice-mfe-male.mp3 captions-fr.vtt captions-fr-male.vtt captions-mfe.vtt captions-mfe-male.vtt; do if test -f "_video/$f"; then cp "_video/$f" _site/video/; fi; done
            for f in _video/weather-*-4k.mp4 _video/weather-*-hd.mp4 _video/weather-*-landscape.mp4; do if test -f "$f"; then cp "$f" _site/video/; fi; done
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy refreshed dashboard
        id: deployment
        uses: actions/deploy-pages@v4
